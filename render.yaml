services:
  - type: web
    name: campus-lost-found
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lostfound-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: lostfound-db
    plan: free

